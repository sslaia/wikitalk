<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiTalk - OAuth Authorization Callback</title>
    <link rel="icon" type="image/png" href="../wikitalk-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F8F9FA;
            color: #202122;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(51, 102, 204, 0.12);
            border: 1px solid #E2E8F0;
            padding: 44px 36px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(51, 102, 204, 0.2);
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            color: #3366CC;
            margin: 0 0 10px 0;
        }
        p {
            font-size: 0.98rem;
            color: #54595D;
            line-height: 1.6;
            margin: 0 0 24px 0;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            border-radius: 30px;
            background-color: #3366CC;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(51, 102, 204, 0.3);
        }
        .btn:hover {
            background-color: #204A87;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(51, 102, 204, 0.4);
        }
        .status-badge {
            display: inline-block;
            background: #EAF3FF;
            color: #3366CC;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

<div class="card">
    <img src="../wikitalk-icon.png" alt="WikiTalk Logo" class="logo">
    <div class="status-badge">Wikimedia OAuth 2.0</div>
    <h1>Authorizing WikiTalk</h1>
    <p id="msg">Returning to WikiTalk app to complete authentication...</p>
    <a id="actionBtn" href="../index.html" class="btn">Return to App</a>
</div>

<script>
    (function() {
        const query = window.location.search;
        if (query) {
            // Attempt deep link redirect back to WikiTalk Flutter app
            const deepLink = 'wikitalk://oauth/callback' + query;
            const btn = document.getElementById('actionBtn');
            btn.href = deepLink;
            btn.innerText = 'Open in WikiTalk';
            
            // Try automatic redirect
            setTimeout(function() {
                window.location.href = deepLink;
            }, 300);
        } else {
            document.getElementById('msg').innerText = 'This page is used for Wikimedia OAuth authentication callback.';
        }
    })();
</script>

</body>
</html>
